<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16856b"><link rel="manifest" href="manifest.json"><title>Felixx</title><style>
:root{color-scheme:light;--bg:#f1f5f3;--card:white;--ink:#17332b;--muted:#64766e;--line:#dce5df;--accent:#16856b}body.dark{color-scheme:dark;--bg:#101b18;--card:#1b2b25;--ink:#e6f5ed;--muted:#a6bcb0;--line:#35483f;--accent:#53cba2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui}main{max-width:680px;margin:auto;padding:20px 16px 90px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:34px;letter-spacing:-2px;margin:0;color:var(--accent)}h2{font-size:20px;margin:0 0 16px}p{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}button,input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg);font-weight:700;border:0}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}input,select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--accent)}.big{font-size:36px;font-weight:750;letter-spacing:-1px}.muted{color:var(--muted);font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:12px}nav button{min-width:85px}small{color:var(--muted)}.entry{border-top:1px solid var(--line);padding:10px 0}.hidden{display:none}</style></head><body><main><header><h1>felixx<span style="font-size:20px">.</span></h1><div><button id="lang">ΕΛ</button> <button id="theme">◐</button></div></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let s;try{s=JSON.parse(localStorage.getItem('felixx-v1'))}catch{}s=s||{lang:'en',dark:matchMedia('(prefers-color-scheme: dark)').matches,profile:{age:29,sex:'m',height:191,weight:81,activity:1.55,goal:250,protein:1.8,water:2500,sat:10,override:0},days:{}};let page='home',date=today(),editing=-1,last=null; s.recipes=s.recipes||[];const t=(a,b)=>s.lang==='el'?b:a, save=()=>localStorage.setItem('felixx-v1',JSON.stringify(s)), day=()=>s.days[date]||(s.days[date]={water:0,soda:0,foods:[]}), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function goals(){let p=s.profile,b=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161),k=p.override||Math.round((b*p.activity+p.goal)/10)*10;return {k,p:Math.round(p.weight*p.protein),sat:Math.round(k*p.sat/900),water:p.water}}function meter(n,v,g,u,limit=false){return `<div class="row"><span>${n}</span><small>${v==null?'?':Math.round(v)} / ${g} ${u}</small></div><div class="bar"><i style="width:${Math.min(100,(v||0)/g*100)}%;${limit&&v>g?'background:#d86b52':''}"></i></div>`}function field(key,name,min,max,step=1){return `<label>${name}</label><input name="${key}" type="number" required min="${min}" max="${max}" step="${step}" value="${s.profile[key]}">`}function sel(key,name,opts){return `<label>${name}</label><select name="${key}">${opts.map(([v,l])=>`<option value="${v}" ${String(s.profile[key])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`}function render(){document.body.classList.toggle('dark',s.dark);document.documentElement.lang=s.lang;$('lang').textContent=t('ΕΛ','EN');$('nav').innerHTML=[['home',t('Today','Σήμερα')],['food',t('Add food','Τρόφιμο')],['profile',t('Goals','Στόχοι')]].map(([v,l])=>`<button class="${page===v?'primary':''}" onclick="page='${v}';editing=-1;render()">${l}</button>`).join('');let d=day(),g=goals(),sum=k=>d.foods.reduce((a,f)=>a+(f[k]||0),0),unknown=k=>d.foods.some(f=>f[k]==null);let h=`<label>${t('Diary date','Ημερομηνία')}</label><input type="date" value="${date}" onchange="date=this.value||today();editing=-1;render()">`;if(page==='home'){h+=quickPanel();h+=`<section><h2>${t('Daily energy','Ημερήσια ενέργεια')}</h2><div class="big">${Math.round(sum('k'))} <small>/ ${g.k} kcal</small></div>${meter(t('Calories','Θερμίδες'),sum('k'),g.k,'kcal')}${meter(t('Protein','Πρωτεΐνη'),sum('p'),g.p,'g')}${meter(t('Saturated fat limit','Όριο κορεσμένων'),unknown('sat')?null:sum('sat'),g.sat,'g',true)}<small>${t('Carbs','Υδατάνθρακες')}: ${Math.round(sum('c'))} g · ${t('Fat','Λίπος')}: ${Math.round(sum('f'))} g</small></section><section><h2>💧 ${t('Water','Νερό')}</h2>${meter(t('Water intake','Κατανάλωση νερού'),d.water+sum('water'),g.water,'ml')}<div class="row">${[250,500,750,-250].map(n=>`<button onclick="day().water=Math.max(0,day().water+${n});save();render()">${n>0?'+':''}${n}</button>`).join('')}</div></section><section><h2>✨ ${t('Soda reduction','Μείωση αναψυκτικών')}</h2><div class="big">${d.soda+sum('soda')} <small>ml</small></div><p>${t('Days recorded without soda are not automatically verified.','Οι ημέρες χωρίς καταγραφή δεν επιβεβαιώνονται αυτόματα.')}</p><div class="row"><button onclick="quickLog('cola')">+330 ml</button><button onclick="undoCola()">−330 ml</button></div><small>${t('New cola entries include calories automatically.','Οι νέες καταγραφές κόλα περιλαμβάνουν θερμίδες.')}</small></section><section><h2>${t('Food diary','Ημερολόγιο τροφίμων')}</h2>${d.foods.map((f,i)=>`<div class="entry row"><div>${esc(f.name)}<br><small>${f.k} kcal · ${f.p} g ${t('protein','πρωτεΐνη')}</small></div><div><button onclick="editFood(${i})">✎</button> <button onclick="removeFood(${i})">×</button></div></div>`).join('')||`<p>${t('No meals logged yet.','Δεν έχουν καταγραφεί γεύματα.')}</p>`}<button class="primary" onclick="page='food';render()">+ ${t('Add food','Προσθήκη τροφίμου')}</button></section>`}if(page==='food'){h+=quickPanel();h+=`<section><h2>${t('Log a meal','Καταγραφή γεύματος')}</h2><p>${t('Enter nutrition for the portion consumed. Photo recognition is not connected yet.','Εισάγετε τα στοιχεία της μερίδας που καταναλώσατε. Η αναγνώριση φωτογραφιών δεν έχει συνδεθεί.')}</p><form id="meal"><label>${t('Food name','Όνομα τροφίμου')}</label><input name="name" required maxlength="120"><div class="grid">${[['k','Calories / Θερμίδες'],['p','Protein / Πρωτεΐνη (g)'],['c','Carbs / Υδατάνθρακες (g)'],['f','Fat / Λίπος (g)'],['sat','Saturated / Κορεσμένα (g)']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" min="0" max="10000" step="0.1" ${k==='sat'?'':'required'}></div>`).join('')}</div><p><button class="primary">${t('Save meal','Αποθήκευση')}</button></p></form></section>`}if(page==='profile'){h+=`<section><h2>${t('Your profile & goals','Προφίλ και στόχοι')}</h2><form id="profile"><div class="grid">${field('age',t('Age','Ηλικία'),18,100)}${sel('sex',t('Equation sex','Φύλο εξίσωσης'),[['m',t('Male','Άνδρας')],['f',t('Female','Γυναίκα')]])}${field('height',t('Height (cm)','Ύψος (cm)'),120,230)}${field('weight',t('Weight (kg)','Βάρος (kg)'),35,250,.1)}</div>${sel('activity',t('Activity','Δραστηριότητα'),[[1.2,t('Sedentary','Καθιστική')],[1.375,t('Light','Ελαφριά')],[1.55,t('Moderate','Μέτρια')],[1.725,t('High','Υψηλή')]])}${sel('goal',t('Weight goal','Στόχος βάρους'),[[-300,t('Lose','Απώλεια')],[0,t('Maintain','Διατήρηση')],[250,t('Gain','Αύξηση')]])}${field('override',t('Manual kcal goal (0 = automatic)','Χειροκίνητος στόχος kcal (0 = αυτόματα)'),0,6000)}${field('protein',t('Protein g/kg','Πρωτεΐνη g/kg'),.8,2.2,.1)}${field('sat',t('Saturated fat maximum (% energy)','Μέγιστα κορεσμένα (% ενέργειας)'),5,10)}${field('water',t('Water goal (ml)','Στόχος νερού (ml)'),500,5000,50)}<p><button class="primary">${t('Save goals','Αποθήκευση στόχων')}</button></p></form><small>${t('Adult estimates using Mifflin–St Jeor; not medical prescriptions. Defaults are examples.','Εκτιμήσεις ενηλίκων Mifflin–St Jeor, όχι ιατρικές οδηγίες. Οι αρχικές τιμές είναι ενδεικτικές.')}</small></section><section><button onclick="backup()">${t('Export backup','Εξαγωγή αντιγράφου')}</button><label>${t('Restore backup (replaces local data)','Επαναφορά (αντικαθιστά τα δεδομένα)')}</label><input type="file" accept="application/json" onchange="restore(this)"></section>`}$('app').innerHTML=h;if($('meal')&&editing>=0){let f=d.foods[editing];if(f)for(let k of ['name','k','p','c','f','sat'])$('meal').elements[k].value=f[k]??'';}if($('meal'))$('meal').onsubmit=e=>{e.preventDefault();let a=Object.fromEntries(new FormData(e.target));for(let k of ['k','p','c','f','sat'])a[k]=a[k]===''?null:Number(a[k]);if(a.sat!==null&&a.sat>a.f){alert(t('Saturated fat cannot exceed total fat.','Τα κορεσμένα δεν υπερβαίνουν το συνολικό λίπος.'));return}if(editing>=0){let old=day().foods[editing];day().foods[editing]={...old,...a};editing=-1;save();page='home';render()}else addEntry(a)};if($('profile'))$('profile').onsubmit=e=>{e.preventDefault();let a=Object.fromEntries(new FormData(e.target));for(let k in a)if(k!=='sex')a[k]=Number(a[k]);if(a.override>0&&a.override<1200){alert(t('Choose a higher goal or automatic estimation.','Επιλέξτε υψηλότερο ή αυτόματο στόχο.'));return}s.profile=a;save();page='home';render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='felixx-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.profile||!x.days||!['en','el'].includes(x.lang)||!Object.keys(s.profile).every(k=>k in x.profile)||!Object.values(x.days).every(d=>Array.isArray(d.foods)&&Number.isFinite(d.water)&&Number.isFinite(d.soda)))throw Error();if(confirm(t('Replace local data?','Αντικατάσταση δεδομένων;'))){s=x;save();render()}}catch{alert(t('Invalid backup','Μη έγκυρο αντίγραφο'))}}
function addEntry(f){let d=day();d.foods.push(f);last={date,index:d.foods.length-1,entry:f};save();page='home';render()}
function undoLast(){if(last&&s.days[last.date]?.foods[last.index]===last.entry){s.days[last.date].foods.splice(last.index,1);save()}last=null;render()}
function removeFood(i){day().foods.splice(i,1);last=null;save();render()}
function editFood(i){editing=i;page='food';render()}
function undoCola(){let i=day().foods.findLastIndex(f=>f.soda===330);if(i>=0)removeFood(i);else{day().soda=Math.max(0,day().soda-330);save();render()}}
function shake(m,w,n){return {name:t('Protein shake','Ρόφημα πρωτεΐνης')+' · '+n+' scoop · '+m+' ml',k:Math.round(m*.64+n*120),p:+(m*.033+n*24).toFixed(1),c:+(m*.048+n*3).toFixed(1),f:+(m*.035+n*1.5).toFixed(1),sat:+(m*.023+n).toFixed(1),water:w,estimated:true}}
function quickLog(kind){if(kind==='cola')addEntry({name:'Coca-Cola Original · 330 ml',k:139,p:0,c:35,f:0,sat:0,soda:330,estimated:true});else addEntry(shake(400,100,Number(kind)))}
function customShake(){let m=Number($('milk').value),w=Number($('mixwater').value),n=Number($('scoops').value);if(![m,w,n].every(Number.isFinite)||m<0||w<0||n<0||m>2000||w>2000||n>5)return;addEntry(shake(m,w,n))}
function saveFavourite(){let f=day().foods.at(-1);if(!f)return;s.recipes=s.recipes||[];s.recipes.push({...f});save();render()}
function quickPanel(){return `<section><h2>${t('Quick log','Γρήγορη καταγραφή')}</h2>${last?`<div class="row"><small>${t('Meal logged','Καταγράφηκε')}</small><button onclick="undoLast()">${t('Undo','Αναίρεση')}</button></div>`:''}<div class="grid"><button class="primary" onclick="quickLog('1')">🥛 ${t('Shake','Ρόφημα')} · 1 scoop</button><button class="primary" onclick="quickLog('2')">🥛 ${t('Shake','Ρόφημα')} · 2 scoops</button><button onclick="day().water+=500;save();render()">💧 500 ml</button><button onclick="quickLog('cola')">🥤 Cola 330 ml</button></div><details style="margin-top:14px"><summary>${t('Adjust shake','Αλλαγή ροφήματος')}</summary><form onsubmit="event.preventDefault();customShake()"><div class="grid"><div><label>${t('Whole milk (ml)','Πλήρες γάλα (ml)')}</label><input id="milk" type="number" min="0" max="2000" value="400" required></div><div><label>${t('Water (ml)','Νερό (ml)')}</label><input id="mixwater" type="number" min="0" max="2000" value="100" required></div></div><label>${t('Whey scoops','Μεζούρες whey')}</label><input id="scoops" type="number" min="0" max="5" step="0.5" value="1" required><p><button class="primary">${t('Log shake','Καταγραφή')}</button></p></form></details><p class="muted">${t('Shake: 400 ml whole milk + 100 ml water. Generic nutrition estimates; verify product labels.','Ρόφημα: 400 ml πλήρες γάλα + 100 ml νερό. Ενδεικτικές τιμές· ελέγξτε τις ετικέτες.')}</p>${(s.recipes||[]).map((f,i)=>`<div class="row entry"><button onclick="addEntry({...s.recipes[${i}]})">+ ${esc(f.name)}</button><button onclick="s.recipes.splice(${i},1);save();render()">×</button></div>`).join('')}${day().foods.length?`<button onclick="saveFavourite()">☆ ${t('Save last meal as favourite','Αγαπημένο τελευταίο γεύμα')}</button>`:''}</section>`}
$('lang').onclick=()=>{s.lang=s.lang==='en'?'el':'en';save();render()};$('theme').onclick=()=>{s.dark=!s.dark;save();render()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
